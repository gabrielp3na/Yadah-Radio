<!-- Audio y Estado del Canal -->
<audio id="radio-speaker" playsinline preload="auto"></audio>

<div class="controls-panel">
  <div class="status-bar">
    <span>Unidad: <b style="color:#f59e0b;" id="lbl-unit">--</b></span>
    <span>GPS: <b id="lbl-gps-status" class="status-warning">Comprobando...</b></span>
    <span>Vel: <b class="status-active" id="lbl-speed">0 km/h</b></span>
    <span>Rumbo: <b class="status-active" id="lbl-heading">0°</b></span>
  </div>

  <div class="channel-status" id="channel-status">
    ● CANAL LIBRE
  </div>

  <button class="btn-ptt" id="btn-ptt">
    <span>🎙️</span> PULSAR PARA HABLAR (Espacio)
  </button>
</div>

<!-- Modal del Buzón de Historial (24h) -->
<div id="history-modal" onclick="toggleHistory(false)">
  <div class="history-card" onclick="event.stopPropagation()">
    <div class="history-head">
      <span>Últimas Transmisiones (24h)</span>
      <span style="cursor:pointer; color:#94a3b8; font-size:1.1rem; padding:4px;" onclick="toggleHistory(false)">✕</span>
    </div>
    <div class="history-list" id="history-list">
      <p style="color:#64748b; font-size:0.85rem;">No hay transmisiones registradas.</p>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // MÓDULO DE AUDIO UNIFICADO Y BLINDADO
  // ==========================================

  // Referencias de los elementos DOM
  const radioSpeaker = document.getElementById('radio-speaker');
  const btnPtt = document.getElementById('btn-ptt');
  const channelStatus = document.getElementById('channel-status');

  let mediaRecorder = null;
  let audioStream = null;
  let isRecording = false;
  let audioChunks = [];
  let audioQueue = [];
  let isPlayingQueue = false;

  const MAX_RECORDING_TIME = 60 * 1000;
  let recordingTimeout = null;

  async function initAudioEngine() {
    try {
      if (!audioStream) {
        audioStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { 
            echoCancellation: true, 
            noiseSuppression: true, 
            autoGainControl: true,
            sampleRate: 16000 
          } 
        });
      }
    } catch (err) {
      console.error("Error al acceder al micrófono:", err);
    }
  }

  async function startAudioRecording(e) {
    if (e) e.preventDefault();

    // Validación robusta del GPS
    const driverActive =
      typeof isDriver === 'function' ? isDriver() : Boolean(isDriver);

    const gpsActive =
      typeof gpsPermissionGranted !== 'undefined'
        ? Boolean(gpsPermissionGranted)
        : false;

    if (driverActive && !gpsActive) {
      channelStatus.className = 'channel-status blocked';
      channelStatus.textContent = '🚫 GPS BLOQUEADO: ACTIVA LA UBICACIÓN';
      if (typeof playBeep === 'function') playBeep(220, 0.15);
      return;
    }

    if (isRecording) return;
    isRecording = true;
    audioChunks = [];

    if (typeof unlockAudioHardware === 'function') unlockAudioHardware();
    await initAudioEngine();

    // 🛡️ Blindaje contra condición de carrera
    if (!isRecording) {
      return;
    }

    if (!audioStream) {
      isRecording = false;
      return;
    }

    if (navigator.vibrate) navigator.vibrate(50);

    if (typeof playBeep === 'function') playBeep(920, 0.04);
    btnPtt.classList.add('active');
    channelStatus.className = 'channel-status transmitting';
    channelStatus.textContent = '▲ GRABANDO AUDIO...';

    if (typeof mqttClient !== 'undefined' && mqttClient && mqttClient.connected) {
      mqttClient.publish(
        TOPIC_ALERT,
        JSON.stringify({ sender: currentUnit })
      );
    }

    try {
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';

      mediaRecorder = new MediaRecorder(audioStream, {
        mimeType: mime,
        bitsPerSecond: 12800
      });

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          audioChunks.push(event.data);
        }
      };

      mediaRecorder.start();

      // Límite automático de 60 segundos
      recordingTimeout = setTimeout(() => {
        if (isRecording) {
          stopAudioRecording();
        }
      }, MAX_RECORDING_TIME);

    } catch (err) {
      console.error('Error iniciando grabación:', err);
      isRecording = false;
      mediaRecorder = null;
      resetPttUI();
    }
  }

  function stopAudioRecording(e) {
    if (e) e.preventDefault();
    if (!isRecording) return;

    isRecording = false;

    if (recordingTimeout) {
      clearTimeout(recordingTimeout);
      recordingTimeout = null;
    }

    const recorder = mediaRecorder;

    if (recorder && recorder.state !== 'inactive') {
      recorder.onstop = () => {
        if (audioChunks.length === 0) {
          audioChunks = [];
          return;
        }

        const completeBlob = new Blob(audioChunks, {
          type: recorder.mimeType || 'audio/webm'
        });

        audioChunks = [];

        const reader = new FileReader();

        reader.onloadend = () => {
          if (
            reader.result &&
            typeof mqttClient !== 'undefined' &&
            mqttClient &&
            mqttClient.connected
          ) {
            mqttClient.publish(
              TOPIC_VOICE,
              JSON.stringify({
                sender: currentUnit,
                payload: reader.result,
                timestamp: Date.now()
              })
            );
          }
        };

        reader.onerror = () => {
          console.error('Error convirtiendo el audio a Base64');
        };

        reader.readAsDataURL(completeBlob);
      };

      recorder.stop();
    }

    resetPttUI();
    if (typeof playBeep === 'function') playBeep(600, 0.04);
  }

  function resetPttUI() {
    btnPtt.classList.remove('active');
    channelStatus.className = 'channel-status';
    channelStatus.textContent = '● CANAL LIBRE';
  }

  function receiveVoiceWalkieTalkie(voiceData) {
    if (!voiceData || !voiceData.sender || voiceData.sender === currentUnit) return;
    if (!voiceData.payload || typeof voiceData.payload !== 'string') return;
    if (!voiceData.payload.startsWith('data:audio/')) return;
    if (voiceData.payload.length > 1500000) return;

    channelStatus.className = 'channel-status receiving';
    channelStatus.textContent = `▼ HABLA: ${voiceData.sender}`;

    audioQueue.push(voiceData);

    if (!isPlayingQueue) {
      processAudioQueue();
    }

    saveAudioToHistory({
      sender: voiceData.sender,
      payload: voiceData.payload,
      timestamp: voiceData.timestamp || Date.now()
    });
  }

  function processAudioQueue() {
    if (audioQueue.length === 0) {
      isPlayingQueue = false;
      channelStatus.className = 'channel-status';
      channelStatus.textContent = '● CANAL LIBRE';
      return;
    }

    isPlayingQueue = true;
    const voiceData = audioQueue.shift();

    try {
      const parts = voiceData.payload.split(';base64,');
      const contentType = parts[0].split(':')[1] || 'audio/webm';
      const raw = window.atob(parts[1]);
      const uInt8Array = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; ++i) {
        uInt8Array[i] = raw.charCodeAt(i);
      }
      const blob = new Blob([uInt8Array], { type: contentType });
      const audioUrl = URL.createObjectURL(blob);

      radioSpeaker.src = audioUrl;
      radioSpeaker.volume = 1.0;

      // Definir onended ANTES de play() y proteger contra bloqueos
      radioSpeaker.onended = () => {
        radioSpeaker.onended = null;
        URL.revokeObjectURL(audioUrl);
        processAudioQueue();
      };

      radioSpeaker.play().catch((error) => {
        console.warn('No se pudo reproducir el audio:', error);
        radioSpeaker.onended = null;
        URL.revokeObjectURL(audioUrl);
        isPlayingQueue = false;
        processAudioQueue();
      });

    } catch (err) {
      console.error("Error procesando elemento de la cola de audio:", err);
      isPlayingQueue = false;
      processAudioQueue();
    }
  }

  // Registro seguro con Pointer Events verificando la existencia del botón
  if (btnPtt) {
    let pttPressed = false;

    btnPtt.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (pttPressed) return;
      pttPressed = true;
      btnPtt.setPointerCapture?.(e.pointerId);
      startAudioRecording(e);
    });

    btnPtt.addEventListener('pointerup', (e) => {
      e.preventDefault();
      if (!pttPressed) return;
      pttPressed = false;
      stopAudioRecording(e);
    });

    btnPtt.addEventListener('pointercancel', (e) => {
      if (!pttPressed) return;
      pttPressed = false;
      stopAudioRecording(e);
    });

    btnPtt.addEventListener('lostpointercapture', () => {
      if (pttPressed) {
        pttPressed = false;
        stopAudioRecording();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
        startAudioRecording(e);
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') stopAudioRecording(e);
    });
  }

  let cachedAudios = [];

  function getStoredAudios() {
    try {
      const stored = JSON.parse(localStorage.getItem('yadah_audio_history') || '[]');
      const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
      const validAudios = stored.filter(item => item && item.timestamp && item.timestamp > oneDayAgo);
      localStorage.setItem('yadah_audio_history', JSON.stringify(validAudios));
      cachedAudios = validAudios;
      return validAudios;
    } catch (e) {
      cachedAudios = [];
      return [];
    }
  }

  function saveAudioToHistory(audioItem) {
    const list = getStoredAudios();
    list.unshift(audioItem);
    if (list.length > 25) list.pop();
    try {
      localStorage.setItem('yadah_audio_history', JSON.stringify(list));
      cachedAudios = list;
    } catch (e) {
      list.splice(10);
      localStorage.setItem('yadah_audio_history', JSON.stringify(list));
      cachedAudios = list;
    }
  }

  function toggleHistory(show) {
    const modal = document.getElementById('history-modal');
    modal.style.display = show ? 'flex' : 'none';
    if (show) renderHistory();
  }

  function renderHistory() {
    const listContainer = document.getElementById('history-list');
    const audios = getStoredAudios();

    listContainer.innerHTML = '';

    if (audios.length === 0) {
      const p = document.createElement('p');
      p.style.color = '#64748b';
      p.style.fontSize = '0.85rem';
      p.textContent = 'No hay transmisiones registradas.';
      listContainer.appendChild(p);
      return;
    }

    audios.forEach((item, index) => {
      const time = new Date(item.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const historyItem = document.createElement('div');
      historyItem.className = 'history-item';

      const infoDiv = document.createElement('div');

      const senderB = document.createElement('b');
      senderB.style.color = '#f59e0b';
      senderB.textContent = item.sender;

      const timeDiv = document.createElement('div');
      timeDiv.style.fontSize = '0.72rem';
      timeDiv.style.color = '#94a3b8';
      timeDiv.textContent = time;

      infoDiv.appendChild(senderB);
      infoDiv.appendChild(timeDiv);

      const playBtn = document.createElement('button');
      playBtn.className = 'btn-play-audio';
      playBtn.textContent = '▶ Oír';
      playBtn.onclick = () => playAudioByIndex(index);

      historyItem.appendChild(infoDiv);
      historyItem.appendChild(playBtn);
      listContainer.appendChild(historyItem);
    });
  }

  function playAudioByIndex(index) {
    if (typeof unlockAudioHardware === 'function') unlockAudioHardware();
    const item = cachedAudios[index];
    if (!item || !item.payload) return;

    try {
      const parts = item.payload.split(';base64,');
      const contentType = parts[0].split(':')[1] || 'audio/webm';
      const raw = window.atob(parts[1]);
      const uInt8Array = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; ++i) {
        uInt8Array[i] = raw.charCodeAt(i);
      }
      const blob = new Blob([uInt8Array], { type: contentType });
      const url = URL.createObjectURL(blob);
      radioSpeaker.src = url;
      radioSpeaker.play();

      radioSpeaker.onended = () => {
        URL.revokeObjectURL(url);
      };
    } catch (err) {
      console.error("Error reproduciendo audio:", err);
    }
  }
</script>
