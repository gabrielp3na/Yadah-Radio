
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yadah Radio WebRTC</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:#0b0f19;
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px
}
.radio{
 width:100%;
 max-width:420px;
 background:#111827;
 border:2px solid #334155;
 border-radius:18px;
 padding:22px
}
h2{text-align:center;color:#fbbf24}
input,button{
 width:100%;
 padding:14px;
 margin-top:10px;
 border-radius:9px;
 border:0;
 font-weight:bold
}
input{background:#020617;color:white;border:1px solid #475569}
button{background:#fbbf24;color:#111827}
#status{
 text-align:center;
 background:#020617;
 padding:14px;
 border-radius:8px;
 margin:16px 0
}
#ptt{
 height:130px;
 border:4px solid #fbbf24;
 background:#1e293b;
 color:#fbbf24;
 font-size:18px
}
#ptt.active{background:#dc2626;color:white}
#users{font-size:13px;color:#94a3b8;margin-top:15px}
</style>
</head>

<body>
<div class="radio">
<h2>📻 YADAH RADIO</h2>

<input id="unit" placeholder="Nombre de unidad" value="Móvil 01">
<button id="save">Guardar unidad</button>

<div id="status">● CONECTANDO...</div>

<button id="ptt">
🎙️<br>
MANTÉN PRESIONADO PARA HABLAR
</button>

<div id="users">Dispositivos conectados: 0</div>
</div>

<script>
const BROKER = "wss://broker.emqx.io:8084/mqtt";
const ROOM = "yadah/radio/webrtc/1";

let unit = localStorage.getItem("yadah_unit") || "Móvil 01";
let clientId = "yadah_" + Math.random().toString(16).slice(2,10);

let mqttClient;
let localStream = null;
let localTrack = null;
let peers = {};
let pendingCandidates = {};
let remoteUsers = new Set();

const status = document.getElementById("status");
const ptt = document.getElementById("ptt");
const unitInput = document.getElementById("unit");
const usersLabel = document.getElementById("users");

unitInput.value = unit;

function setStatus(text){
 status.textContent = text;
}

function signal(message){
 if(mqttClient && mqttClient.connected){
   mqttClient.publish(ROOM, JSON.stringify({
     ...message,
     sender: clientId,
     unit
   }));
 }
}

function createPeer(remoteId, remoteUnit){
 if(peers[remoteId]) return peers[remoteId];

 const pc = new RTCPeerConnection({
   iceServers:[
     {urls:"stun:stun.l.google.com:19302"},
     {urls:"stun:stun1.l.google.com:19302"}
   ]
 });

 peers[remoteId] = pc;
 pendingCandidates[remoteId] = [];

 pc.onicecandidate = event => {
   if(event.candidate){
     signal({
       type:"ice",
       target:remoteId,
       candidate:event.candidate
     });
   }
 };

 pc.ontrack = event => {
   let audio = document.getElementById("audio_"+remoteId);

   if(!audio){
     audio = document.createElement("audio");
     audio.id = "audio_"+remoteId;
     audio.autoplay = true;
     audio.playsInline = true;
     document.body.appendChild(audio);
   }

   audio.srcObject = event.streams[0];
   audio.play().catch(()=>{});
 };

 pc.onconnectionstatechange = () => {
   if(["failed","closed","disconnected"].includes(pc.connectionState)){
     delete peers[remoteId];
     remoteUsers.delete(remoteId);
     updateUsers();
   }
 };

 if(localStream){
   localStream.getTracks().forEach(track=>{
     pc.addTrack(track,localStream);
   });
 }

 return pc;
}

async function prepareMicrophone(){
 if(localStream) return;

 localStream = await navigator.mediaDevices.getUserMedia({
   audio:{
     echoCancellation:true,
     noiseSuppression:true,
     autoGainControl:true
   }
 });

 localTrack = localStream.getAudioTracks()[0];
 localTrack.enabled = false;

 Object.keys(peers).forEach(id=>{
   localStream.getTracks().forEach(track=>{
     peers[id].addTrack(track,localStream);
   });
 });
}

async function makeOffer(remoteId,remoteUnit){
 const pc = createPeer(remoteId,remoteUnit);

 if(clientId > remoteId) return;

 const offer = await pc.createOffer();
 await pc.setLocalDescription(offer);

 signal({
   type:"offer",
   target:remoteId,
   offer:pc.localDescription
 });
}

async function handleOffer(data){
 if(data.target !== clientId) return;

 const pc = createPeer(data.sender,data.unit);

 await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

 for(const candidate of pendingCandidates[data.sender]){
   await pc.addIceCandidate(candidate).catch(()=>{});
 }

 pendingCandidates[data.sender] = [];

 const answer = await pc.createAnswer();
 await pc.setLocalDescription(answer);

 signal({
   type:"answer",
   target:data.sender,
   answer:pc.localDescription
 });
}

async function handleAnswer(data){
 if(data.target !== clientId) return;

 const pc = peers[data.sender];
 if(!pc) return;

 await pc.setRemoteDescription(
   new RTCSessionDescription(data.answer)
 );

 for(const candidate of pendingCandidates[data.sender]){
   await pc.addIceCandidate(candidate).catch(()=>{});
 }

 pendingCandidates[data.sender] = [];
}

async function handleIce(data){
 if(data.target !== clientId) return;

 const pc = peers[data.sender] || createPeer(data.sender,data.unit);
 const candidate = new RTCIceCandidate(data.candidate);

 if(pc.remoteDescription){
   await pc.addIceCandidate(candidate).catch(()=>{});
 }else{
   pendingCandidates[data.sender].push(candidate);
 }
}

function updateUsers(){
 usersLabel.textContent =
 "Dispositivos conectados: "+remoteUsers.size;
}

function connect(){
 mqttClient = mqtt.connect(BROKER,{
   clientId,
   clean:true,
   reconnectPeriod:3000
 });

 mqttClient.on("connect",()=>{
   mqttClient.subscribe(ROOM);
   setStatus("● CONECTADO");
   signal({type:"hello"});
 });

 mqttClient.on("reconnect",()=>{
   setStatus("● RECONECTANDO...");
 });

 mqttClient.on("error",()=>{
   setStatus("● ERROR DE CONEXIÓN");
 });

 mqttClient.on("message",async(topic,message)=>{
   try{
     const data = JSON.parse(message.toString());

     if(data.sender === clientId) return;

     if(data.type === "hello"){
       remoteUsers.add(data.sender);
       updateUsers();

       signal({
         type:"hello_ack",
         target:data.sender
       });

       createPeer(data.sender,data.unit);

       if(clientId < data.sender){
         await makeOffer(data.sender,data.unit);
       }
     }

     if(data.type === "hello_ack" && data.target === clientId){
       remoteUsers.add(data.sender);
       updateUsers();

       createPeer(data.sender,data.unit);

       if(clientId < data.sender){
         await makeOffer(data.sender,data.unit);
       }
     }

     if(data.type === "offer") await handleOffer(data);
     if(data.type === "answer") await handleAnswer(data);
     if(data.type === "ice") await handleIce(data);

     if(data.type === "talking"){
       if(data.target === clientId){
         setStatus("🔊 HABLANDO: "+data.unit);
       }
     }

     if(data.type === "stopped"){
       if(data.target === clientId){
         setStatus("● CONECTADO");
       }
     }

   }catch(error){
     console.error("Error de señalización:",error);
   }
 });
}

async function startTalking(event){
 event.preventDefault();

 try{
   await prepareMicrophone();

   if(!localTrack) return;

   localTrack.enabled = true;
   ptt.classList.add("active");
   setStatus("🔴 TRANSMITIENDO");

   Object.keys(peers).forEach(id=>{
     signal({
       type:"talking",
       target:id
     });
   });

 }catch(error){
   console.error(error);
   setStatus("❌ PERMISO DE MICRÓFONO DENEGADO");
 }
}

function stopTalking(event){
 if(event) event.preventDefault();

 if(localTrack){
   localTrack.enabled = false;
 }

 ptt.classList.remove("active");
 setStatus("● CONECTADO");

 Object.keys(peers).forEach(id=>{
   signal({
     type:"stopped",
     target:id
   });
 }
}

document.getElementById("save").onclick=()=>{
 unit=unitInput.value.trim() || "Móvil 01";
 localStorage.setItem("yadah_unit",unit);
 setStatus("● UNIDAD: "+unit);
};

ptt.addEventListener("pointerdown",startTalking);
ptt.addEventListener("pointerup",stopTalking);
ptt.addEventListener("pointerleave",stopTalking);
ptt.addEventListener("pointercancel",stopTalking);

connect();
</script>
</body>
</html>
