<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Yadah Radio WebRTC - Canal Compartido</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #090e1a;
  color: #f8fafc;
  font-family: Arial, sans-serif;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  padding: 18px;
}

.radio-container {
  width: 100%;
  max-width: 420px;
  background: #111827;
  border: 2px solid #263449;
  border-radius: 22px;
  padding: 25px 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,.5);
  margin: auto;
}

h1 {
  text-align: center;
  color: #fbbf24;
  font-size: 1.7rem;
  margin-bottom: 25px;
}

.unit-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

input {
  min-width: 0;
  flex: 1;
  background: #030712;
  color: white;
  border: 1px solid #475569;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  user-select: text;
  -webkit-user-select: text;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.save-button {
  background: #fbbf24;
  color: #111827;
  border: none;
  border-radius: 12px;
  padding: 0 15px;
  font-weight: bold;
}

.status {
  background: #030712;
  color: #cbd5e1;
  border: 1px solid #263449;
  border-radius: 12px;
  padding: 17px 10px;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  margin-bottom: 20px;
  min-height: 52px;
}

.connected { color: #34d399; }
.error { color: #f87171; }
.transmitting { background: #b91c1c; color: white; border-color: #ef4444; }
.receiving { background: #047857; color: white; border-color: #10b981; }

.ptt-button {
  width: 100%;
  min-height: 190px;
  border: 5px solid #fbbf24;
  border-radius: 28px;
  background: linear-gradient(145deg,#1e293b,#0f172a);
  color: #fbbf24;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  text-align: center;
  touch-action: none;
}

.microphone { font-size: 58px; pointer-events: none; }
.button-text { font-size: 17px; font-weight: 900; pointer-events: none; }

.ptt-button.active {
  background: #f59e0b;
  color: #111827;
  border-color: #fef08a;
  transform: scale(.98);
}

.ptt-button:disabled { opacity: .6; }

.info, .connection-info {
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 20px;
}

.history {
  margin-top: 25px;
  border-top: 1px solid #334155;
  padding-top: 20px;
}

.history h2 {
  color: #fbbf24;
  font-size: 18px;
  margin-bottom: 12px;
}

.audio-item {
  background: #030712;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
}

.audio-item small {
  display: block;
  color: #94a3b8;
  margin-bottom: 8px;
}

.audio-item audio {
  width: 100%;
}

.empty-history {
  color: #94a3b8;
  font-size: 13px;
  text-align: center;
}
</style>
</head>

<body>

<main class="radio-container">

<h1>📻 YADAH RADIO</h1>

<div class="unit-row">
<input id="unit-input" type="text" maxlength="30" value="Móvil 01">
<button class="save-button" id="save-button">Guardar</button>
</div>

<div class="status" id="status">● CONECTANDO...</div>

<button class="ptt-button" id="ptt-button" disabled>
<span class="microphone">🎙️</span>
<span class="button-text">MANTÉN PRESIONADO<br>PARA HABLAR</span>
</button>

<div class="info">
Canal de voz en tiempo real y buzón protegido compartido.
</div>

<div class="connection-info" id="connection-info">Preparando conexión...</div>

<section class="history">
<h2>📁 Buzón Compartido (Protegido)</h2>
<div id="audio-history">
<p class="empty-history">No hay audios en el canal.</p>
</div>
</section>

</main>

<audio id="remote-audio" autoplay playsinline></audio>

<script>
"use strict";

const MQTT_URL = "wss://broker.emqx.io:8084/mqtt";
const SIGNAL_TOPIC = "yadah/radio/webrtc/signaling/v3";
const AUDIO_SHARE_TOPIC = "yadah/radio/shared/audio/v1";
const ROOM_NAME = "yadah-radio-prueba";

const STUN_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" }
];

const unitInput = document.getElementById("unit-input");
const saveButton = document.getElementById("save-button");
const statusElement = document.getElementById("status");
const pttButton = document.getElementById("ptt-button");
const remoteAudio = document.getElementById("remote-audio");
const connectionInfo = document.getElementById("connection-info");
const audioHistory = document.getElementById("audio-history");

let currentUnit = localStorage.getItem("yadah_radio_unit") || "Móvil 01";
let deviceId = currentUnit + "_" + Math.random().toString(16).substring(2,10);

let client = null;
let localStream = null;
let peerConnection = null;
let remoteUnit = "";
let pendingCandidates = [];

let isConnecting = false;
let isTalking = false;
let mediaRecorder = null;
let recordedChunks = [];

let database;
const databaseRequest = indexedDB.open("YadahRadioSharedDB", 1);

databaseRequest.onupgradeneeded = function(event) {
  database = event.target.result;
  if (!database.objectStoreNames.contains("audios")) {
    database.createObjectStore("audios", { keyPath: "id", autoIncrement: true });
  }
};

databaseRequest.onsuccess = function(event) {
  database = event.target.result;
  loadAudioHistory();
};

function setStatus(message, type = "") {
  statusElement.textContent = message;
  statusElement.className = "status";
  if (type) statusElement.classList.add(type);
}

saveButton.addEventListener("click", function() {
  const newName = unitInput.value.trim();
  if (!newName) return alert("Escribe el nombre.");
  currentUnit = newName;
  localStorage.setItem("yadah_radio_unit", currentUnit);
  alert("Unidad guardada: " + currentUnit);
});

unitInput.value = currentUnit;

function connectMQTT() {
  if (isConnecting) return;
  isConnecting = true;
  setStatus("● CONECTANDO...");

  client = mqtt.connect(MQTT_URL, { clientId: "yadah_" + Math.random().toString(16).substring(2,10), clean: true });

  client.on("connect", function() {
    isConnecting = false;
    client.subscribe(SIGNAL_TOPIC);
    client.subscribe(AUDIO_SHARE_TOPIC);
    setStatus("● RADIO CONECTADO", "connected");
    pttButton.disabled = false;
    sendSignal({ type: "hello" });
  });

  client.on("message", function(topic, message) {
    if (topic === SIGNAL_TOPIC) receiveSignal(message);
    if (topic === AUDIO_SHARE_TOPIC) receiveSharedAudio(message);
  });
}

function sendSignal(data) {
  if (!client || !client.connected) return;
  client.publish(SIGNAL_TOPIC, JSON.stringify({ room: ROOM_NAME, sender: currentUnit, deviceId: deviceId, timestamp: Date.now(), ...data }));
}

async function receiveSignal(message) {
  try {
    const data = JSON.parse(message.toString());
    if (data.room !== ROOM_NAME || data.deviceId === deviceId || (data.target && data.target !== deviceId)) return;
    remoteUnit = data.sender;
    if (data.type === "hello") await handleHello(data);
    if (data.type === "offer") await handleOffer(data);
    if (data.type === "answer") await handleAnswer(data);
    if (data.type === "candidate") await handleCandidate(data);
  } catch(e){}
}

async function createPeerConnection(otherDeviceId) {
  if (peerConnection) return peerConnection;
  peerConnection = new RTCPeerConnection({ iceServers: STUN_SERVERS });

  peerConnection.onicecandidate = function(event) {
    if (event.candidate) sendSignal({ type: "candidate", target: otherDeviceId, candidate: event.candidate });
  };

  peerConnection.ontrack = function(event) {
    if (event.streams && event.streams[0]) {
      remoteAudio.srcObject = event.streams[0];
      remoteAudio.play().catch(()=>{});
      setStatus("▼ RECIBIENDO: " + remoteUnit, "receiving");
    }
  };

  peerConnection.onconnectionstatechange = function() {
    if (peerConnection && peerConnection.connectionState === "connected") {
      setStatus("● CONEXIÓN DIRECTA ACTIVA", "connected");
    }
  };

  if (!localStream) await initializeMicrophone();
  const audioTrack = localStream.getAudioTracks()[0];
  if (audioTrack) {
    audioTrack.enabled = false;
    peerConnection.addTrack(audioTrack, localStream);
  }
  return peerConnection;
}

async function initializeMicrophone() {
  if (localStream) return true;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    localStream.getAudioTracks()[0].enabled = false;
    return true;
  } catch(e) {
    alert("Permiso de micrófono denegado.");
    return false;
  }
}

async function handleHello(data) {
  if (currentUnit.toLowerCase() < data.sender.toLowerCase()) return;
  const connection = await createPeerConnection(data.deviceId);
  if (!connection) return;
  const offer = await connection.createOffer();
  await connection.setLocalDescription(offer);
  sendSignal({ type: "offer", target: data.deviceId, offer: offer });
}

async function handleOffer(data) {
  const connection = await createPeerConnection(data.deviceId);
  if (!connection) return;
  await connection.setRemoteDescription(new RTCSessionDescription(data.offer));
  for (const c of pendingCandidates) await connection.addIceCandidate(c);
  pendingCandidates = [];
  const answer = await connection.createAnswer();
  await connection.setLocalDescription(answer);
  sendSignal({ type: "answer", target: data.deviceId, answer: answer });
}

async function handleAnswer(data) {
  if (!peerConnection) return;
  await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
  for (const c of pendingCandidates) await connection.addIceCandidate(c);
  pendingCandidates = [];
}

async function handleCandidate(data) {
  const candidate = new RTCIceCandidate(data.candidate);
  if (peerConnection && peerConnection.remoteDescription) {
    try { await peerConnection.addIceCandidate(candidate); } catch(e){}
  } else {
    pendingCandidates.push(candidate);
  }
}

/* GRABACIÓN Y COMPARTIR AUDIO */

function startRecording() {
  if (!localStream) return;
  recordedChunks = [];
  try {
    mediaRecorder = new MediaRecorder(localStream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = () => {
        if (client && client.connected) {
          client.publish(AUDIO_SHARE_TOPIC, JSON.stringify({
            unit: currentUnit,
            date: new Date().toLocaleString("es-SV"),
            timestamp: Date.now(),
            payload: reader.result
          }));
        }
      };
    };
    mediaRecorder.start();
  } catch(e){}
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
}

function receiveSharedAudio(message) {
  try {
    const data = JSON.parse(message.toString());
    fetch(data.payload)
      .then(res => res.blob())
      .then(blob => {
        saveAudioToDB({
          unit: data.unit,
          date: data.date,
          timestamp: data.timestamp,
          blob: blob
        });
      });
  } catch(e){}
}

function saveAudioToDB(audioObj) {
  if (!database) return;
  const transaction = database.transaction(["audios"], "readwrite");
  const store = transaction.objectStore("audios");
  store.add(audioObj);
  transaction.oncomplete = () => loadAudioHistory();
}

function loadAudioHistory() {
  if (!database) return;
  audioHistory.innerHTML = "";
  const transaction = database.transaction(["audios"], "readonly");
  const store = transaction.objectStore("audios");
  const request = store.getAll();

  request.onsuccess = function() {
    const audios = request.result.sort((a, b) => b.timestamp - a.timestamp);
    if (!audios.length) {
      audioHistory.innerHTML = '<p class="empty-history">No hay audios en el canal.</p>';
      return;
    }

    audios.forEach(audioData => {
      const item = document.createElement("div");
      item.className = "audio-item";

      const title = document.createElement("strong");
      title.textContent = "🎙️ " + audioData.unit;

      const date = document.createElement("small");
      date.textContent = audioData.date;

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.src = URL.createObjectURL(audioData.blob);

      item.appendChild(title);
      item.appendChild(date);
      item.appendChild(audio);
      audioHistory.appendChild(item);
    });
  };
}

/* PTT */

async function startPTT(e) {
  if (e) e.preventDefault();
  if (isTalking || !peerConnection || peerConnection.connectionState !== "connected") return;
  if (!localStream) await initializeMicrophone();

  const audioTrack = localStream.getAudioTracks()[0];
  if (!audioTrack) return;

  audioTrack.enabled = true;
  isTalking = true;
  pttButton.classList.add("active");
  setStatus("▲ TRANSMITIENDO: " + currentUnit, "transmitting");
  startRecording();
  if (navigator.vibrate) navigator.vibrate(50);
}

function stopPTT(e) {
  if (e) e.preventDefault();
  if (!isTalking) return;

  const audioTrack = localStream && localStream.getAudioTracks()[0];
  if (audioTrack) audioTrack.enabled = false;

  isTalking = false;
  pttButton.classList.remove("active");
  setStatus("● CONEXIÓN DIRECTA ACTIVA", "connected");
  stopRecording();
}

pttButton.addEventListener("pointerdown", e => { e.preventDefault(); startPTT(e); });
pttButton.addEventListener("pointerup", e => { e.preventDefault(); stopPTT(e); });
pttButton.addEventListener("pointercancel", e => { e.preventDefault(); stopPTT(e); });

window.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && document.activeElement !== unitInput) startPTT(e); });
window.addEventListener("keyup", e => { if (e.code === "Space") stopPTT(e); });

document.addEventListener("click", () => { remoteAudio.play().catch(()=>{}); }, { passive: true });

connectMQTT();
</script>
</body>
</html>
