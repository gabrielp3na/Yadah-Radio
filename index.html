<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Yadah Radio - Módulo PTT Aislado</title>
  <!-- MQTT WebSockets -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .radio-container {
      max-width: 400px;
      margin: auto;
      width: 100%;
      background: #111827;
      border: 2px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .header-title {
      text-align: center;
      color: #f59e0b;
      font-size: 1.2rem;
      font-weight: 800;
    }
    .status-box {
      background: #030712;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #94a3b8;
      border: 1px solid #1f2937;
      transition: all 0.2s ease;
    }
    .status-box.transmitting {
      background-color: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
    }
    .status-box.receiving {
      background-color: #059669;
      color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 15px rgba(5, 150, 105, 0.6);
    }
    .btn-ptt {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 4px solid #f59e0b;
      border-radius: 24px;
      color: #f59e0b;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .btn-ptt:active, .btn-ptt.active {
      background: radial-gradient(circle, #f59e0b 0%, #d97706 100%);
      color: #030712;
      border-color: #fef08a;
      transform: scale(0.97);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.8);
    }
    .unit-input-group {
      display: flex;
      gap: 8px;
    }
    .unit-input-group input {
      flex: 1;
      background: #030712;
      border: 1px solid #334155;
      padding: 10px;
      color: white;
      border-radius: 8px;
      font-weight: bold;
    }
    .unit-input-group button {
      background: #f59e0b;
      border: none;
      color: #0b0f19;
      font-weight: 800;
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <audio id="radio-speaker" playsinline preload="auto"></audio>

  <div class="radio-container">
    <div class="header-title">📻 Yadah PTT - Módulo de Radio</div>
    
    <div class="unit-input-group">
      <input type="text" id="input-unit" value="Móvil 01" placeholder="Nombre de tu unidad">
      <button onclick="setUnitName()">Fijar</button>
    </div>

    <div class="status-box" id="channel-status">
      ● CANAL LIBRE
    </div>

    <button class="btn-ptt" id="btn-ptt">
      <span style="font-size: 2rem;">🎙️</span>
      <span>MANTÉN PRESIONADO PARA HABLAR</span>
    </button>
    
    <div style="font-size: 0.75rem; color: #64748b; text-align: center;">
      Tip: También puedes usar la barra <b>Espacio</b> del teclado para transmitir.
    </div>
  </div>

  <script>
    let currentUnit = localStorage.getItem('isolated_unit') || 'Móvil 01';
    document.getElementById('input-unit').value = currentUnit;

    function setUnitName() {
      const val = document.getElementById('input-unit').value.trim();
      if (val) {
        currentUnit = val;
        localStorage.setItem('isolated_unit', val);
        alert(`Unidad configurada como: ${val}`);
      }
    }

    const channelStatus = document.getElementById('channel-status');
    const btnPtt = document.getElementById('btn-ptt');
    const radioSpeaker = document.getElementById('radio-speaker');

    // Desbloqueo de Audio Context
    let audioCtx = null;
    function unlockAudioHardware() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        radioSpeaker.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
        radioSpeaker.play().catch(() => {});
      } catch (e) {}
    }

    window.addEventListener('touchstart', unlockAudioHardware, { passive: true });
    window.addEventListener('click', unlockAudioHardware, { passive: true });

    function playBeep(freq = 880, duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // MQTT Conexión
    let mqttClient = null;
    const TOPIC_VOICE = 'yadah/radio/flota/voice';
    const TOPIC_ALERT = 'yadah/radio/flota/alert';

    function connectNetwork() {
      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: 'iso_' + Math.random().toString(16).substring(2, 9),
        clean: true
      });

      mqttClient.on('connect', () => {
        mqttClient.subscribe(TOPIC_VOICE);
        mqttClient.subscribe(TOPIC_ALERT);
      });

      mqttClient.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (topic === TOPIC_ALERT && data.sender !== currentUnit) {
            channelStatus.className = 'status-box receiving';
            channelStatus.textContent = `▼ HABLANDO: ${data.sender}`;
            playBeep(660, 0.06);
          } else if (topic === TOPIC_VOICE && data.sender !== currentUnit) {
            queueVoice(data);
          }
        } catch(e){}
      });
    }
    connectNetwork();

    // Grabación y Reproducción PTT
    let mediaRecorder = null;
    let audioStream = null;
    let isRecording = false;
    let audioQueue = [];
    let isPlaying = false;

    async function initMic() {
      if (!audioStream) {
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 }
        });
      }
    }

    async function startPTT(e) {
      if (e) e.preventDefault();
      if (isRecording) return;
      isRecording = true;

      unlockAudioHardware();
      await initMic();
      if (!audioStream) { isRecording = false; return; }

      if (navigator.vibrate) navigator.vibrate(60);
      playBeep(920, 0.05);

      btnPtt.classList.add('active');
      channelStatus.className = 'status-box transmitting';
      channelStatus.textContent = '▲ TRANSMITIENDO EN VIVO...';

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(TOPIC_ALERT, JSON.stringify({ sender: currentUnit }));
      }

      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder = new MediaRecorder(audioStream, { mimeType: mime, bitsPerSecond: 12800 });

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0 && isRecording) {
          const reader = new FileReader();
          reader.readAsDataURL(event.data);
          reader.onloadend = () => {
            if (mqttClient && mqttClient.connected && isRecording) {
              mqttClient.publish(TOPIC_VOICE, JSON.stringify({
                sender: currentUnit,
                payload: reader.result
              }));
            }
          };
        }
      };
      mediaRecorder.start(100);
    }

    function stopPTT(e) {
      if (e) e.preventDefault();
      if (!isRecording) return;
      isRecording = false;

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      btnPtt.classList.remove('active');
      channelStatus.className = 'status-box';
      channelStatus.textContent = '● CANAL LIBRE';
      playBeep(500, 0.05);
    }

    function queueVoice(data) {
      audioQueue.push(data);
      if (!isPlaying) processQueue();
    }

    function processQueue() {
      if (audioQueue.length === 0) {
        isPlaying = false;
        channelStatus.className = 'status-box';
        channelStatus.textContent = '● CANAL LIBRE';
        return;
      }
      isPlaying = true;
      const item = audioQueue.shift();

      try {
        const parts = item.payload.split(';base64,');
        const raw = window.atob(parts[1]);
        const arr = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; ++i) arr[i] = raw.charCodeAt(i);
        const blob = new Blob([arr], { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);

        radioSpeaker.src = url;
        radioSpeaker.volume = 1.0;
        radioSpeaker.play().catch(()=>{});

        radioSpeaker.onended = () => {
          URL.revokeObjectURL(url);
          processQueue();
        };
      } catch(e) {
        processQueue();
      }
    }

    // Eventos de control
    btnPtt.addEventListener('touchstart', startPTT, { passive: false });
    btnPtt.addEventListener('touchend', stopPTT, { passive: false });
    btnPtt.addEventListener('mousedown', startPTT);
    btnPtt.addEventListener('mouseup', stopPTT);
    btnPtt.addEventListener('mouseleave', stopPTT);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
        startPTT(e);
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') stopPTT(e);
    });
  </script>
</body>
</html>
