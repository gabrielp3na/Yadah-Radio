<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transportes Yadah - Radio & Despacho</title>
  
  <!-- Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Leaflet CSS y JS para Mapa en Vivo -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    h1 { font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .badge-canal { background: #334155; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; color: var(--text-muted); }
    
    #login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 14px;
    }
    .user-btn {
      width: 100%;
      max-width: 280px;
      background: var(--card);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .user-btn:active {
      border-color: var(--primary);
      background: #334155;
    }

    #main-screen {
      flex: 1;
      display: none;
      flex-direction: column;
      height: calc(100vh - 50px);
      position: relative;
    }

    #map-container {
      flex: 1;
      width: 100%;
      min-height: 200px;
      background: #020617;
      z-index: 1;
    }

    .control-deck {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .status-val { font-weight: 700; color: var(--text); }
    
    .active-talker {
      font-size: 0.95rem;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      background: #0b1120;
      color: var(--text-muted);
      border: 1px dashed var(--border);
    }
    .active-talker.talking {
      color: var(--danger);
      border-color: var(--danger);
      background: #450a0a;
      font-weight: bold;
    }

    .ptt-deck {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 0;
    }
    .btn-ptt {
      width: 100%;
      max-width: 320px;
      height: 64px;
      border-radius: 12px;
      background: #1e293b;
      border: 2px solid var(--primary);
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      touch-action: none;
    }
    .btn-ptt.transmitting {
      background: #064e3b;
      border-color: var(--success);
      color: #fff;
    }
    .btn-ptt.blocked {
      background: #2b1111;
      border-color: var(--danger);
      color: #f87171;
      opacity: 0.5;
      cursor: not-allowed;
    }

    #audio-container { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>📻 Yadah PTT & Despacho</h1>
    <div class="badge-canal">Canal: <strong>General</strong></div>
  </header>

  <div id="login-screen">
    <p style="color: var(--text-muted); margin-bottom: 8px;">Selecciona tu terminal de trabajo:</p>
    <button class="user-btn" onclick="iniciarTerminal('Modulador')">🎧 Modulador (Base Central)</button>
    <button class="user-btn" onclick="iniciarTerminal('Pedro')">🚗 Unidad - Pedro</button>
    <button class="user-btn" onclick="iniciarTerminal('Lima')">🚗 Unidad - Lima</button>
  </div>

  <div id="main-screen">
    <div id="map-container"></div>

    <div class="control-deck">
      <div class="status-row">
        <span>Terminal: <strong id="lbl-usuario" class="status-val">-</strong></span>
        <span>GPS: <strong id="lbl-gps" class="status-val" style="color: var(--primary);">Buscando...</strong></span>
        <span>Enlace: <strong id="lbl-red" class="status-val" style="color: var(--success);">Conectado</strong></span>
      </div>

      <div id="banner-canal" class="active-talker">Canal Libre</div>

      <div class="ptt-deck">
        <div id="btn-ptt" class="btn-ptt">
          <span>PULSAR PARA HABLAR</span>
        </div>
      </div>
    </div>
  </div>

  <div id="audio-container"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDlDbRRbbO6LKo-7mfpamRgtRLE5k0Yiy8",
      authDomain: "yadahradio-b3224.firebaseapp.com",
      databaseURL: "https://yadahradio-b3224-default-rtdb.firebaseio.com",
      projectId: "yadahradio-b3224",
      storageBucket: "yadahradio-b3224.firebasestorage.app",
      messagingSenderId: "291182609196",
      appId: "1:291182609196:web:8d1ff9576f2078ab976289",
      measurementId: "G-0NR0M2EBWN"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const iceServersConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun.relay.metered.ca:80" },
        {
          urls: "turn:global.relay.metered.ca:80",
          username: "b63280a331c5f650aeb07db8",
          credential: "X8UqfpyU08dK3NcP"
        },
        {
          urls: "turn:global.relay.metered.ca:80?transport=tcp",
          username: "b63280a331c5f650aeb07db8",
          credential: "X8UqfpyU08dK3NcP"
        },
        {
          urls: "turn:global.relay.metered.ca:443",
          username: "b63280a331c5f650aeb07db8",
          credential: "X8UqfpyU08dK3NcP"
        },
        {
          urls: "turns:global.relay.metered.ca:443?transport=tcp",
          username: "b63280a331c5f650aeb07db8",
          credential: "X8UqfpyU08dK3NcP"
        }
      ],
      iceCandidatePoolSize: 10
    };

    const DIRECTORIO_UNIDADES = ["Modulador", "Pedro", "Lima"];
    let miTerminal = null;
    let localStream = null;
    let transmitiendo = false;
    let canalOcupadoPor = null;

    const peers = {};
    let mapa = null;
    const marcadores = {};

    async function iniciarTerminal(nombre) {
      miTerminal = nombre;
      document.getElementById('lbl-usuario').innerText = nombre;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'flex';

      activarWakeLock();
      inicializarMapa();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        localStream.getAudioTracks().forEach(t => t.enabled = false);
      } catch (err) {
        alert("Acceso al micrófono denegado. Podrás monitorear, pero no transmitir.");
      }

      const amOnline = db.ref(`.info/connected`);
      const presRef = db.ref(`sistema/presencia/${miTerminal}`);

      amOnline.on('value', (snap) => {
        if (snap.val() === true) {
          presRef.onDisconnect().remove();
          presRef.set(true);
        }
      });

      db.ref(`sistema/senales/${miTerminal}`).remove();

      iniciarEscuchaCanalPTT();
      iniciarEventosBotonPTT();
      iniciarMeshWebRTC();
      iniciarRastreadorGPS();
      iniciarEscuchaUbicacionesRemotas();
    }

    async function activarWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (e) {
        console.warn("WakeLock no disponible.");
      }
    }

    function inicializarMapa() {
      mapa = L.map('map-container').setView([13.6929, -89.2182], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(mapa);
      
      setTimeout(() => { mapa.invalidateSize(); }, 400);
    }

    function iniciarRastreadorGPS() {
      if (!("geolocation" in navigator)) {
        document.getElementById('lbl-gps').innerText = 'No compatible';
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          document.getElementById('lbl-gps').innerText = 'Activo';
          document.getElementById('lbl-gps').style.color = 'var(--success)';

          actualizarMarcadorEnMapa(miTerminal, latitude, longitude);

          db.ref(`sistema/ubicaciones/${miTerminal}`).set({
            lat: latitude,
            lng: longitude,
            velocidad: speed || 0,
            actualizado: Date.now(),
            conectado: true
          });

          db.ref(`sistema/ubicaciones/${miTerminal}/conectado`).onDisconnect().set(false);
        },
        (error) => {
          console.warn("GPS error:", error.message);
          document.getElementById('lbl-gps').innerText = 'Sin Señal';
          document.getElementById('lbl-gps').style.color = 'var(--danger)';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function iniciarEscuchaUbicacionesRemotas() {
      db.ref(`sistema/ubicaciones`).on('value', (snap) => {
        const datos = snap.val();
        if (!datos) return;

        Object.keys(datos).forEach((unidad) => {
          if (unidad !== miTerminal) {
            const loc = datos[unidad];
            if (loc && loc.conectado && loc.lat && loc.lng) {
              actualizarMarcadorEnMapa(unidad, loc.lat, loc.lng);
            } else if (marcadores[unidad]) {
              mapa.removeLayer(marcadores[unidad]);
              delete marcadores[unidad];
            }
          }
        });
      });
    }

    function actualizarMarcadorEnMapa(unidad, lat, lng) {
      if (!mapa) return;

      if (!marcadores[unidad]) {
        const colorPin = unidad === 'Modulador' ? '#f59e0b' : '#10b981';
        marcadores[unidad] = L.circleMarker([lat, lng], {
          radius: 8,
          fillColor: colorPin,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(mapa).bindPopup(`<b>${unidad}</b>`);
      } else {
        marcadores[unidad].setLatLng([lat, lng]);
      }
    }

    function iniciarEscuchaCanalPTT() {
      const banner = document.getElementById('banner-canal');
      const ptt = document.getElementById('btn-ptt');

      db.ref(`sistema/canal_activo`).on('value', (snap) => {
        const quienHabla = snap.val();
        canalOcupadoPor = quienHabla;

        if (quienHabla) {
          if (quienHabla === miTerminal) {
            banner.className = 'active-talker talking';
            banner.innerText = `Transmitiendo al canal general...`;
          } else {
            banner.className = 'active-talker talking';
            banner.innerText = `Canal Ocupado por: [${quienHabla}]`;
            if (!transmitiendo) {
              ptt.className = 'btn-ptt blocked';
            }
          }
        } else {
          banner.className = 'active-talker';
          banner.innerText = 'Canal Libre';
          if (!transmitiendo) {
            ptt.className = 'btn-ptt';
          }
        }
      });
    }

    function iniciarEventosBotonPTT() {
      const ptt = document.getElementById('btn-ptt');
      const canalRef = db.ref(`sistema/canal_activo`);

      const presionar = async (e) => {
        if (e) e.preventDefault();
        if (transmitiendo) return;

        document.querySelectorAll('audio').forEach(a => a.play().catch(() => {}));

        if (canalOcupadoPor && canalOcupadoPor !== miTerminal) return;

        const txn = await canalRef.transaction((actual) => {
          if (actual === null) return miTerminal;
          return undefined;
        });

        if (!txn.committed) return;

        canalRef.onDisconnect().set(null);

        transmitiendo = true;
        ptt.className = 'btn-ptt transmitting';
        ptt.querySelector('span').innerText = 'TRANSMITIENDO';

        if (localStream) {
          localStream.getAudioTracks().forEach(t => t.enabled = true);
        }
      };

      const soltar = (e) => {
        if (e) e.preventDefault();
        if (!transmitiendo) return;

        transmitiendo = false;
        ptt.className = 'btn-ptt';
        ptt.querySelector('span').innerText = 'PULSAR PARA HABLAR';

        if (localStream) {
          localStream.getAudioTracks().forEach(t => t.enabled = false);
        }

        canalRef.transaction((actual) => {
          if (actual === miTerminal) return null;
          return actual;
        });
      };

      ptt.addEventListener('touchstart', presionar, { passive: false });
      ptt.addEventListener('touchend', soltar, { passive: false });
      ptt.addEventListener('mousedown', presionar);
      ptt.addEventListener('mouseup', soltar);
      ptt.addEventListener('mouseleave', soltar);
    }

    function iniciarMeshWebRTC() {
      const pares = DIRECTORIO_UNIDADES.filter(u => u !== miTerminal);

      pares.forEach(par => {
        const soyIniciador = miTerminal.localeCompare(par) < 0;

        db.ref(`sistema/presencia/${par}`).on('value', async (snap) => {
          if (snap.val()) {
            if (!peers[par]) {
              const pc = crearConexionPar(par);
              peers[par] = pc;

              if (soyIniciador) {
                try {
                  const offer = await pc.createOffer();
                  await pc.setLocalDescription(offer);
                  db.ref(`sistema/senales/${par}/${miTerminal}/oferta`).set({
                    sdp: offer.sdp,
                    type: offer.type
                  });
                } catch (err) {
                  console.error("Fallo generando oferta:", err);
                }
              }
            }
          } else {
            if (peers[par]) {
              peers[par].close();
              delete peers[par];
            }
            removerElementoAudio(par);
          }
        });

        db.ref(`sistema/senales/${miTerminal}/${par}/oferta`).on('value', async (snap) => {
          const oferta = snap.val();
          if (!oferta) return;

          let pc = peers[par];
          if (!pc) {
            pc = crearConexionPar(par);
            peers[par] = pc;
          }

          try {
            await pc.setRemoteDescription(new RTCSessionDescription(oferta));
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            db.ref(`sistema/senales/${par}/${miTerminal}/respuesta`).set({
              sdp: ans.sdp,
              type: ans.type
            });
          } catch (e) {
            console.error("Error gestionando oferta:", e);
          }
        });

        db.ref(`sistema/senales/${miTerminal}/${par}/respuesta`).on('value', async (snap) => {
          const respuesta = snap.val();
          if (!respuesta) return;

          const pc = peers[par];
          if (pc && pc.signalingState === "have-local-offer") {
            try {
              await pc.setRemoteDescription(new RTCSessionDescription(respuesta));
            } catch (e) {
              console.error("Error fijando respuesta remota:", e);
            }
          }
        });

        db.ref(`sistema/senales/${miTerminal}/${par}/candidatos`).on('child_added', async (snap) => {
          const val = snap.val();
          if (!val) return;

          const pc = peers[par];
          if (pc) {
            try {
              await pc.addIceCandidate(new RTCIceCandidate(val));
            } catch (e) {
              console.warn("Fallo añadiendo candidato ICE:", e);
            }
          }
        });
      });
    }

    function crearConexionPar(companero) {
      const pc = new RTCPeerConnection(iceServersConfig);

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          db.ref(`sistema/senales/${companero}/${miTerminal}/candidatos`).push(e.candidate.toJSON());
        }
      };

      pc.ontrack = (e) => {
        obtenerOCrearElementoAudio(companero, e.streams[0]);
      };

      return pc;
    }

    function obtenerOCrearElementoAudio(companero, stream) {
      let audio = document.getElementById(`audio-remote-${companero}`);
      if (!audio) {
        audio = document.createElement('audio');
        audio.id = `audio-remote-${companero}`;
        audio.autoplay = true;
        audio.playsInline = true;
        document.getElementById('audio-container').appendChild(audio);
      }
      audio.srcObject = stream;
      audio.play().catch(err => console.warn("Permiso de reproducción pendiente:", err));
    }

    function removerElementoAudio(companero) {
      const el = document.getElementById(`audio-remote-${companero}`);
      if (el) el.remove();
    }
  </script>
</body>
</html>
