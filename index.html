<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Flota - Móvil</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        input { 
            padding: 12px; 
            margin: 10px 0; 
            font-size: 16px; 
            width: 85%; 
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button.btn-login { 
            padding: 12px 20px; 
            font-size: 16px; 
            background: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
            width: 90%;
            margin-top: 10px;
        }
        button.btn-login:active { background: #0056b3; }
        
        /* Botón estilo Radio PTT (Grande y rojo) */
        #micButton { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 140px; 
            height: 140px; 
            font-size: 18px;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0px 6px 20px rgba(255, 77, 77, 0.4);
            margin-top: 20px;
            outline: none;
        }
        #micButton:active {
            background: #cc0000;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="card" id="login-section">
        <h2>Acceso a Flota</h2>
        <p style="color: #666; font-size: 14px;">Ingrese su contraseña para iniciar</p>
        <input type="password" id="passwordInput" placeholder="Contraseña (1994)">
        <br>
        <button class="btn-login" onclick="probarLogin()">Ingresar</button>
    </div>

    <!-- Pantalla Principal de la Flota (Oculta hasta iniciar sesión) -->
    <div class="card" id="app-section" style="display:none;">
        <h2>Panel de Motorista</h2>
        <p style="color: green; font-size: 14px;">● GPS Activo en Segundo Plano</p>
        <p style="font-size: 13px; color: #555;">Mantén presionado o toca para hablar por radio:</p>
        
        <!-- Botón de Radio PTT -->
        <button id="micButton">RADIO PTT</button>
    </div>

    <!-- Vinculamos tu archivo de código JavaScript -->
    <script src="app.js"></script>
    <script>
        // Función puente para conectar la interfaz visual con el script
        function probarLogin() {
            const pass = document.getElementById('passwordInput').value;
            const exito = intentarLogin(pass);
            
            if (exito) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('app-section').style.display = 'block';
            }
        }
    </script>
</body>
</html>
