<script>
'use strict';

/* =========================================================
   YADAH FLEET GPS — GPS, CÁMARA 3D Y NAVEGACIÓN
   ========================================================= */

/* ---------- CONFIGURACIÓN ---------- */

const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
const TOPIC_GPS = 'yadah/fleet/gps/v1';

const ALL_UNITS = [
  'Móvil 01',
  'Móvil 02',
  'Móvil 03',
  'Móvil 04',
  'Móvil 05'
];

/* ---------- ESTADO GENERAL ---------- */

let currentUnit = localStorage.getItem('yadah_gps_unit') || null;
let mqttClient = null;
let gpsWatchId = null;

let myLastCoords = null;
let lastValidHeading = 0;
let lastCameraUpdate = 0;

let firstPersonMode = true;
let isNightMode = localStorage.getItem('yadah_night_mode') === 'true';
let showTraffic = true;
let isSosActive = false;

let pendingDestination = null;
let activeRouteLayerId = null;
let activeRouteSourceId = null;
let searchTimeout = null;

let userMovedMap = false;
let isNavigating = false;

const fleetMarkers = {};
const fleetStatusMap = {};

ALL_UNITS.forEach(unit => {
  fleetStatusMap[unit] = {
    lastSeen: 0,
    speed: 0,
    lat: null,
    lon: null,
    heading: 0,
    state: 'offline'
  };
});

/* ---------- ELEMENTOS HTML ---------- */

const loginScreen = document.getElementById('login-screen');
const lblUnit = document.getElementById('lbl-unit');
const lblSpeed = document.getElementById('lbl-speed');
const lblHeading = document.getElementById('lbl-heading');
const lblGpsStatus = document.getElementById('lbl-gps-status');

const btnViewMode = document.getElementById('btn-view-mode');
const btnThemeMode = document.getElementById('btn-theme-mode');
const btnTrafficToggle = document.getElementById('btn-traffic-toggle');
const btnSos = document.getElementById('btn-sos');
const btnToggleFleet = document.getElementById('btn-toggle-fleet');

const fleetSummaryBar = document.getElementById('fleet-summary-bar');
const fleetListDrawer = document.getElementById('fleet-list-drawer');
const navSearchBar = document.getElementById('nav-search-bar');
const searchSuggestions = document.getElementById('search-suggestions');
const navRouteInfo = document.getElementById('nav-route-info');
const lblRouteStats = document.getElementById('lbl-route-stats');
const gpsLockBanner = document.getElementById('gps-lock-banner');

function isDriver() {
  return currentUnit && currentUnit !== 'Modulador';
}

function isModulator() {
  return currentUnit === 'Modulador';
}

/* ---------- MAPA ---------- */

const map = new maplibregl.Map({
  container: 'map',
  maxPitch: 85,
  pitchWithRotate: true,
  dragRotate: true,
  attributionControl: true,

  style: {
    version: 8,

    sources: {
      'google-base': {
        type: 'raster',
        tiles: [
          'https://mt0.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
          'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}'
        ],
        tileSize: 256
      },

      'google-traffic': {
        type: 'raster',
        tiles: [
          'https://mt0.google.com/vt/lyrs=h@159000000,traffic&x={x}&y={y}&z={z}',
          'https://mt1.google.com/vt/lyrs=h@159000000,traffic&x={x}&y={y}&z={z}'
        ],
        tileSize: 256
      }
    },

    layers: [
      {
        id: 'google-base-layer',
        type: 'raster',
        source: 'google-base',
        minzoom: 0,
        maxzoom: 22
      },

      {
        id: 'google-traffic-layer',
        type: 'raster',
        source: 'google-traffic',
        minzoom: 0,
        maxzoom: 22,
        layout: {
          visibility: 'visible'
        },
        paint: {
          'raster-opacity': 0.7
        }
      }
    ]
  },

  center: [-89.3562, 13.7242],
  zoom: 15,
  pitch: 45,
  bearing: 0
});

map.on('dragstart', () => {
  userMovedMap = true;
});

map.on('rotatestart', () => {
  userMovedMap = true;
});

map.on('pitchstart', () => {
  userMovedMap = true;
});

/* ---------- UTILIDADES ---------- */

function normalizeHeading(angle) {
  if (typeof angle !== 'number' || !Number.isFinite(angle)) {
    return lastValidHeading;
  }

  if (angle < 0) angle += 360;

  return angle % 360;
}

function smoothHeading(previous, next, factor = 0.25) {
  let difference = next - previous;

  if (difference > 180) difference -= 360;
  if (difference < -180) difference += 360;

  return (previous + difference * factor + 360) % 360;
}

function updateViewButtonUI() {
  btnViewMode.textContent = firstPersonMode ? '🚘' : '🗺️';
  btnViewMode.classList.toggle('active', firstPersonMode);
}

function applyNightModeTheme() {
  const container = document.getElementById('map-container');

  if (isNightMode) {
    container.classList.add('map-night-mode');
    btnThemeMode.textContent = '☀️';
    btnThemeMode.classList.add('active');
  } else {
    container.classList.remove('map-night-mode');
    btnThemeMode.textContent = '🌙';
    btnThemeMode.classList.remove('active');
  }

  localStorage.setItem('yadah_night_mode', isNightMode);
}

/* ---------- SELECCIÓN DE UNIDAD ---------- */

function selectUnit(id) {
  if (!id) return;

  stopGPS();
  disconnectMQTT();

  currentUnit = id;
  localStorage.setItem('yadah_gps_unit', id);

  lblUnit.textContent = id;
  loginScreen.style.display = 'none';

  firstPersonMode = isDriver();

  btnSos.style.display = isDriver() ? 'flex' : 'none';
  navSearchBar.style.display = isDriver() ? 'flex' : 'none';
  btnToggleFleet.style.display = isModulator() ? 'block' : 'none';
  fleetSummaryBar.style.display = isModulator() ? 'flex' : 'none';

  updateViewButtonUI();
  applyNightModeTheme();

  connectMQTT();

  if (isDriver()) {
    startGPS();
  } else {
    lblGpsStatus.textContent = 'Central';
    lblGpsStatus.className = 'status-active';
    gpsLockBanner.style.display = 'none';
  }
}

function logoutUnit() {
  stopGPS();
  disconnectMQTT();

  localStorage.removeItem('yadah_gps_unit');
  location.reload();
}

/* ---------- GPS ---------- */

function startGPS() {
  if (!currentUnit || isModulator()) return;

  if (!navigator.geolocation) {
    showGPSError('GPS no disponible en este dispositivo.');
    return;
  }

  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }

  lblGpsStatus.textContent = 'Buscando...';
  lblGpsStatus.className = 'status-warning';

  gpsWatchId = navigator.geolocation.watchPosition(
    handleGPSPosition,
    handleGPSError,
    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 15000
    }
  );
}

function stopGPS() {
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
}

function handleGPSPosition(position) {
  const coords = position.coords;

  if (
    typeof coords.latitude !== 'number' ||
    typeof coords.longitude !== 'number'
  ) {
    return;
  }

  const latitude = coords.latitude;
  const longitude = coords.longitude;

  const rawSpeed = Number.isFinite(coords.speed)
    ? coords.speed * 3.6
    : 0;

  const currentSpeed = Math.max(0, rawSpeed);

  let currentHeading = Number.isFinite(coords.heading)
    ? normalizeHeading(coords.heading)
    : lastValidHeading;

  /*
    Cuando el vehículo está en movimiento,
    suavizamos el rumbo para evitar giros bruscos.
  */
  if (currentSpeed > 3 && Number.isFinite(coords.heading)) {
    currentHeading = smoothHeading(
      lastValidHeading,
      currentHeading,
      0.25
    );

    lastValidHeading = currentHeading;
  }

  myLastCoords = {
    lon: longitude,
    lat: latitude
  };

  lblGpsStatus.textContent = 'Activo';
  lblGpsStatus.className = 'status-active';
  gpsLockBanner.style.display = 'none';

  lblSpeed.textContent = Math.round(currentSpeed) + ' km/h';
  lblHeading.textContent = Math.round(currentHeading) + '°';

  updateSingleFleetMarker(
    currentUnit,
    longitude,
    latitude,
    currentSpeed,
    currentHeading,
    false
  );

  publishGPS(
    longitude,
    latitude,
    currentSpeed,
    currentHeading
  );

  updateNavigationCamera(
    longitude,
    latitude,
    currentSpeed,
    currentHeading
  );
}

function handleGPSError(error) {
  let message = 'No se pudo obtener la ubicación GPS.';

  if (error.code === 1) {
    message = 'GPS denegado. Activa los permisos de ubicación.';
  }

  if (error.code === 2) {
    message = 'No se pudo determinar la ubicación.';
  }

  if (error.code === 3) {
    message = 'El GPS tardó demasiado en responder.';
  }

  showGPSError(message);
}

function showGPSError(message) {
  gpsLockBanner.style.display = 'flex';
  gpsLockBanner.querySelector('span').textContent = '⚠️ ' + message;

  lblGpsStatus.textContent = 'Sin GPS';
  lblGpsStatus.className = 'status-warning';
}

/* ---------- CÁMARA DE NAVEGACIÓN ---------- */

function updateNavigationCamera(
  longitude,
  latitude,
  speed,
  heading
) {
  if (!firstPersonMode || userMovedMap) return;

  const now = Date.now();

  /*
    Evita mover la cámara demasiadas veces por segundo.
  */
  if (now - lastCameraUpdate < 250) return;

  lastCameraUpdate = now;

  const moving = speed > 3;

  const targetZoom = moving ? 17.8 : 17;
  const targetPitch = moving ? 63 : 55;

  /*
    La cámara se mantiene detrás del vehículo.
    El rumbo se aplica únicamente cuando hay movimiento.
  */
  const targetBearing = moving ? heading : map.getBearing();

  map.easeTo({
    center: [longitude, latitude],
    zoom: targetZoom,
    pitch: targetPitch,
    bearing: targetBearing,
    duration: 700,
    essential: true
  });
}

function recenterMap() {
  if (!myLastCoords) {
    alert('Esperando señal GPS...');
    return;
  }

  userMovedMap = false;

  map.easeTo({
    center: [myLastCoords.lon, myLastCoords.lat],
    zoom: firstPersonMode ? 17.8 : 16,
    pitch: firstPersonMode ? 63 : 0,
    bearing: firstPersonMode ? lastValidHeading : 0,
    duration: 900,
    essential: true
  });
}

/* ---------- MARCADORES DE VEHÍCULOS ---------- */

function updateSingleFleetMarker(
  unitId,
  lon,
  lat,
  speed = 0,
  heading = 0,
  isSos = false
) {
  if (
    !unitId ||
    !Number.isFinite(Number(lon)) ||
    !Number.isFinite(Number(lat))
  ) {
    return;
  }

  const numericLon = Number(lon);
  const numericLat = Number(lat);
  const numericSpeed = Number(speed) || 0;
  const numericHeading = normalizeHeading(Number(heading) || 0);

  fleetStatusMap[unitId] = {
    lastSeen: Date.now(),
    speed: numericSpeed,
    lat: numericLat,
    lon: numericLon,
    heading: numericHeading,
    state: numericSpeed < 3 ? 'stopped' : 'online'
  };

  if (!fleetMarkers[unitId]) {
    const container = document.createElement('div');
    container.className = 'car-marker-container';

    const badge = document.createElement('div');
    badge.className = 'car-badge';
    badge.textContent = unitId;

    const svgRotator = document.createElement('div');
    svgRotator.className = 'car-svg-rotator';

    svgRotator.innerHTML = `
      <svg viewBox="0 0 24 24" width="44" height="44">
        <path
          d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.76l.12.34V17z"
          fill="${unitId === currentUnit ? '#38bdf8' : '#f59e0b'}"
        />

        <circle cx="7.5" cy="14.5" r="1.5" fill="#ffffff"/>
        <circle cx="16.5" cy="14.5" r="1.5" fill="#ffffff"/>
      </svg>
    `;

    container.appendChild(badge);
    container.appendChild(svgRotator);

    const marker = new maplibregl.Marker({
      element: container,
      anchor: 'center'
    })
      .setLngLat([numericLon, numericLat])
      .addTo(map);

    fleetMarkers[unitId] = {
      marker,
      container,
      svgRotator,
      badge
    };
  } else {
    const fleetMarker = fleetMarkers[unitId];

    fleetMarker.marker.setLngLat([
      numericLon,
      numericLat
    ]);

    fleetMarker.svgRotator.style.transform =
      `rotate(${numericHeading}deg)`;
  }

  const currentMarker = fleetMarkers[unitId];

  if (isSos) {
    currentMarker.badge.style.background = '#dc2626';
    currentMarker.badge.textContent = '🚨 ' + unitId;
  } else {
    currentMarker.badge.style.background = '#030712';
    currentMarker.badge.textContent = unitId;
  }
}

/* ---------- MQTT ---------- */

function connectMQTT() {
  if (!currentUnit) return;

  disconnectMQTT();

  const clientId =
    'yadah_gps_' +
    Math.random().toString(16).substring(2, 10);

  mqttClient = mqtt.connect(MQTT_BROKER, {
    clientId,
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 10000
  });

  mqttClient.on('connect', () => {
    console.log('MQTT conectado');

    mqttClient.subscribe(TOPIC_GPS, error => {
      if (error) {
        console.error('Error al suscribirse:', error);
      }
    });
  });

  mqttClient.on('message', (topic, payload) => {
    if (topic !== TOPIC_GPS) return;

    try {
      const data = JSON.parse(payload.toString());

      if (!data.unit || data.unit === currentUnit) {
        return;
      }

      const timestamp = Number(data.timestamp) || 0;

      /*
        Ignora mensajes demasiado antiguos.
      */
      if (timestamp && Date.now() - timestamp > 120000) {
        return;
      }

      updateSingleFleetMarker(
        data.unit,
        Number(data.lon),
        Number(data.lat),
        Number(data.speed) || 0,
        Number(data.heading) || 0,
        Boolean(data.sos)
      );
    } catch (error) {
      console.warn('Mensaje MQTT inválido');
    }
  });

  mqttClient.on('error', error => {
    console.warn('Error MQTT:', error.message);
  });
}

function disconnectMQTT() {
  if (mqttClient) {
    try {
      mqttClient.end(true);
    } catch (error) {
      console.warn('No se pudo cerrar MQTT');
    }

    mqttClient = null;
  }
}

function publishGPS(
  longitude,
  latitude,
  speed,
  heading
) {
  if (!mqttClient || !mqttClient.connected) return;

  const gpsData = {
    unit: currentUnit,
    lon: longitude,
    lat: latitude,
    speed,
    heading,
    sos: isSosActive,
    timestamp: Date.now()
  };

  mqttClient.publish(
    TOPIC_GPS,
    JSON.stringify(gpsData),
    {
      qos: 0,
      retain: false
    }
  );
}

/* ---------- BÚSQUEDA DE DESTINOS ---------- */

function handleSearchInput(query) {
  clearTimeout(searchTimeout);

  if (!query || query.trim().length < 2) {
    searchSuggestions.style.display = 'none';
    return;
  }

  searchTimeout = setTimeout(async () => {
    try {
      const response = await fetch(
        'https://nominatim.openstreetmap.org/search?' +
        new URLSearchParams({
          format: 'json',
          q: query,
          limit: '4',
          countrycodes: 'sv'
        })
      );

      const results = await response.json();

      if (!Array.isArray(results) || results.length === 0) {
        searchSuggestions.style.display = 'none';
        return;
      }

      searchSuggestions.innerHTML = '';

      results.forEach(result => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';

        const title = document.createElement('b');
        title.textContent = '📍 ' + result.display_name.split(',')[0];

        const description = document.createElement('span');
        description.style.color = '#94a3b8';
        description.style.fontSize = '0.7rem';
        description.textContent = result.display_name;

        item.appendChild(title);
        item.appendChild(document.createElement('br'));
        item.appendChild(description);

        item.addEventListener('click', () => {
          selectSuggestion(
            Number(result.lon),
            Number(result.lat),
            result.display_name
          );
        });

        searchSuggestions.appendChild(item);
      });

      searchSuggestions.style.display = 'flex';
    } catch (error) {
      console.warn('Error en búsqueda');
    }
  }, 400);
}

function selectSuggestion(lon, lat, displayName) {
  pendingDestination = {
    lon: Number(lon),
    lat: Number(lat),
    label: displayName.split(',')[0]
  };

  document.getElementById('input-destination').value =
    pendingDestination.label;

  searchSuggestions.style.display = 'none';

  lblRouteStats.textContent =
    `📍 Destino: ${pendingDestination.label}`;

  navRouteInfo.style.display = 'flex';

  map.flyTo({
    center: [pendingDestination.lon, pendingDestination.lat],
    zoom: 15,
    duration: 900
  });
}

async function prepareRouteDestination() {
  searchSuggestions.style.display = 'none';

  const input = document.getElementById('input-destination');
  const query = input.value.trim();

  if (!query) return;

  try {
    const response = await fetch(
      'https://nominatim.openstreetmap.org/search?' +
      new URLSearchParams({
        format: 'json',
        q: query,
        limit: '1',
        countrycodes: 'sv'
      })
    );

    const results = await response.json();

    if (!results.length) {
      alert('Lugar no encontrado.');
      return;
    }

    selectSuggestion(
      Number(results[0].lon),
      Number(results[0].lat),
      results[0].display_name
    );
  } catch (error) {
    alert('No se pudo buscar el destino.');
  }
}

/* ---------- RUTAS OSRM ---------- */

async function startNavigationMatch() {
  if (!pendingDestination) {
    alert('Selecciona primero un destino.');
    return;
  }

  if (!myLastCoords) {
    alert('Esperando ubicación GPS.');
    return;
  }

  try {
    lblRouteStats.textContent = 'Calculando ruta...';

    const url =
      'https://router.project-osrm.org/route/v1/driving/' +
      `${myLastCoords.lon},${myLastCoords.lat};` +
      `${pendingDestination.lon},${pendingDestination.lat}` +
      '?overview=full&steps=true&geometries=geojson';

    const response = await fetch(url);
    const data = await response.json();

    if (
      data.code !== 'Ok' ||
      !data.routes ||
      !data.routes.length
    ) {
      alert('No se encontró una ruta.');
      return;
    }

    const route = data.routes[0];

    const kilometers =
      (route.distance / 1000).toFixed(1);

    const minutes =
      Math.max(1, Math.round(route.duration / 60));

    lblRouteStats.textContent =
      `🚀 ${pendingDestination.label} · ` +
      `${kilometers} km · ${minutes} min`;

    navRouteInfo.style.display = 'flex';

    removeActiveRoute();

    activeRouteLayerId = 'yadah-route-layer';
    activeRouteSourceId = 'yadah-route-source';

    map.addSource(activeRouteSourceId, {
      type: 'geojson',
      data: {
        type: 'Feature',
        properties: {},
        geometry: route.geometry
      }
    });

    map.addLayer({
      id: activeRouteLayerId,
      type: 'line',
      source: activeRouteSourceId,
      layout: {
        'line-join': 'round',
        'line-cap': 'round'
      },
      paint: {
        'line-color': '#38bdf8',
        'line-width': 7,
        'line-opacity': 0.9
      }
    });

    const routeCoordinates = route.geometry.coordinates;

    const bounds = routeCoordinates.reduce(
      (boundsObject, coordinate) => {
        return boundsObject.extend(coordinate);
      },
      new maplibregl.LngLatBounds(
        routeCoordinates[0],
        routeCoordinates[0]
      )
    );

    map.fitBounds(bounds, {
      padding: {
        top: 140,
        bottom: 180,
        left: 40,
        right: 40
      },
      duration: 1000
    });

    isNavigating = true;
    userMovedMap = false;

  } catch (error) {
    console.error('Error al calcular la ruta:', error);
    alert('No se pudo calcular la ruta.');
  }
}

function removeActiveRoute() {
  if (
    activeRouteLayerId &&
    map.getLayer(activeRouteLayerId)
  ) {
    map.removeLayer(activeRouteLayerId);
  }

  if (
    activeRouteSourceId &&
    map.getSource(activeRouteSourceId)
  ) {
    map.removeSource(activeRouteSourceId);
  }

  activeRouteLayerId = null;
  activeRouteSourceId = null;
}

function cancelNavigation() {
  pendingDestination = null;
  isNavigating = false;

  navRouteInfo.style.display = 'none';

  removeActiveRoute();

  document.getElementById('input-destination').value = '';

  recenterMap();
}

/* ---------- CONTROLES DEL MAPA ---------- */

btnThemeMode.addEventListener('click', () => {
  isNightMode = !isNightMode;
  applyNightModeTheme();
});

btnTrafficToggle.addEventListener('click', () => {
  showTraffic = !showTraffic;

  btnTrafficToggle.classList.toggle(
    'active',
    showTraffic
  );

  if (map.getLayer('google-traffic-layer')) {
    map.setLayoutProperty(
      'google-traffic-layer',
      'visibility',
      showTraffic ? 'visible' : 'none'
    );
  }
});

btnViewMode.addEventListener('click', () => {
  firstPersonMode = !firstPersonMode;

  updateViewButtonUI();

  if (firstPersonMode) {
    userMovedMap = false;
    recenterMap();
  } else if (myLastCoords) {
    map.easeTo({
      center: [myLastCoords.lon, myLastCoords.lat],
      zoom: 16,
      pitch: 0,
      bearing: 0,
      duration: 800
    });
  }
});

document
  .getElementById('btn-recenter')
  .addEventListener('click', recenterMap);

/* ---------- SOS ---------- */

function triggerSOS() {
  isSosActive = !isSosActive;

  btnSos.classList.toggle(
    'active',
    isSosActive
  );

  publishSOS();

  alert(
    isSosActive
      ? '🚨 ¡Alerta SOS activada!'
      : '✅ Alerta SOS desactivada.'
  );
}

function publishSOS() {
  if (!mqttClient || !mqttClient.connected) return;
  if (!myLastCoords) return;

  mqttClient.publish(
    TOPIC_GPS,
    JSON.stringify({
      unit: currentUnit,
      lon: myLastCoords.lon,
      lat: myLastCoords.lat,
      speed: 0,
      heading: lastValidHeading,
      sos: isSosActive,
      timestamp: Date.now()
    })
  );
}

/* ---------- PANEL DE FLOTA ---------- */

function toggleFleetDrawer(show) {
  fleetListDrawer.style.display = show ? 'flex' : 'none';

  if (!show) return;

  const list = document.getElementById('fleet-items-list');
  list.innerHTML = '';

  ALL_UNITS.forEach(unit => {
    const data = fleetStatusMap[unit];

    const row = document.createElement('div');
    row.className = 'unit-card-row';

    const name = document.createElement('b');
    name.textContent = '🚘 ' + unit;

    const status = document.createElement('span');
    status.className = 'badge-stat';

    const elapsed =
      data.lastSeen
        ? Date.now() - data.lastSeen
        : Infinity;

    if (elapsed > 120000) {
      status.classList.add('offline');
      status.textContent = 'Desconectado';
    } else if (data.speed < 3) {
      status.classList.add('stopped');
      status.textContent = 'Detenido';
    } else {
      status.classList.add('online');
      status.textContent = 'En línea';
    }

    row.appendChild(name);
    row.appendChild(status);

    row.addEventListener('click', () => {
      if (!data.lat || !data.lon) {
        alert('Este vehículo no tiene ubicación disponible.');
        return;
      }

      userMovedMap = true;

      map.flyTo({
        center: [data.lon, data.lat],
        zoom: 17,
        pitch: 45,
        duration: 900
      });
    });

    list.appendChild(row);
  });
}

/* ---------- INICIALIZACIÓN ---------- */

function initializeApplication() {
  if (!currentUnit) {
    loginScreen.style.display = 'flex';
    return;
  }

  loginScreen.style.display = 'none';
  lblUnit.textContent = currentUnit;

  btnSos.style.display = isDriver() ? 'flex' : 'none';
  navSearchBar.style.display = isDriver() ? 'flex' : 'none';

  btnToggleFleet.style.display =
    isModulator() ? 'block' : 'none';

  fleetSummaryBar.style.display =
    isModulator() ? 'flex' : 'none';

  firstPersonMode = isDriver();

  updateViewButtonUI();
  applyNightModeTheme();

  connectMQTT();

  if (isDriver()) {
    startGPS();
  } else {
    lblGpsStatus.textContent = 'Central';
    lblGpsStatus.className = 'status-active';
  }
}

window.addEventListener('beforeunload', () => {
  stopGPS();
  disconnectMQTT();
});

initializeApplication();

</script>
