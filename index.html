<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yadah PTT & Despacho</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Barra Superior */
    header {
      background-color: #1e293b;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #f59e0b;
    }

    .channel-tag {
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    /* Contenedor del Mapa */
    #map-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: #1e293b;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Consola Inferior */
    .controls-panel {
      background-color: #1e293b;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid #334155;
      z-index: 1000;
    }

    /* Barra de Estado */
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #94a3b8;
      padding: 0 4px;
    }

    .status-active {
      color: #10b981;
      font-weight: 600;
    }

    /* Estado del Canal */
    .channel-status {
      background-color: #0f172a;
      text-align: center;
      padding: 7px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #94a3b8;
      border: 1px solid #334155;
      transition: all 0.2s ease;
    }

    .channel-status.transmitting {
      background-color: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }

    /* Botón PTT Principal */
    .ptt-wrapper {
      width: 100%;
    }

    .btn-ptt {
      width: 100%;
      height: 62px;
      background: linear-space-gradient;
      background-color: #0f172a;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      color: #f59e0b;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.15);
      touch-action: none;
      transition: background-color 0.1s, transform 0.05s;
    }

    .btn-ptt:active, .btn-ptt.active {
      background-color: #f59e0b;
      color: #0f172a;
      transform: scale(0.98);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
    }

    /* Barra de Botones Auxiliares */
    .aux-bar {
      display: flex;
      gap: 10px;
    }

    .btn-aux {
      flex: 1;
      padding: 8px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-aux.active-mute {
      background-color: #7f1d1d;
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* Tooltip de Marcadores */
    .unit-tag {
      background: #0f172a !important;
      border: 1px solid #f59e0b !important;
      color: #f8fafc !important;
      font-weight: bold !important;
      font-size: 0.75rem !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
    }
    .leaflet-tooltip-top:before {
      border-top-color: #f59e0b !important;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <header>
    <div class="brand">
      <span>📻</span> Yadah PTT & Despacho
    </div>
    <div class="channel-tag">Canal: General</div>
  </header>

  <!-- Mapa Interactivo -->
  <div id="map-container">
    <div id="map"></div>
  </div>

  <!-- Consola de Control Inferior -->
  <div class="controls-panel">
    <!-- Barra de Estado -->
    <div class="status-bar">
      <span>Terminal: <b style="color:#f8fafc;" id="lbl-unit">Modulador</b></span>
      <span>GPS: <b class="status-active">Activo</b></span>
      <span>Audio: <b class="status-active" id="lbl-audio-status">Abierto</b></span>
    </div>

    <!-- Indicador de Tráfico de Radio -->
    <div class="channel-status" id="channel-status">
      ● CANAL LIBRE
    </div>

    <!-- Botón Pulsar para Hablar (PTT) -->
    <div class="ptt-wrapper">
      <button class="btn-ptt" id="btn-ptt">
        <span>🎙️</span> PULSAR PARA HABLAR
      </button>
    </div>

    <!-- Botones Auxiliares: Muteo y Cambio de Capa -->
    <div class="aux-bar">
      <button class="btn-aux" id="btn-mute">
        <span>🔊</span> Silencio Cabina
      </button>
      <button class="btn-aux" id="btn-layer">
        <span>🛰️</span> Modo Satélite
      </button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Capas de Google Maps
    const googleRoads = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Google Maps'
    });

    const googleSatellite = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Google Maps Satellite'
    });

    // Inicializar mapa centrado por defecto
    const map = L.map('map', {
      center: [13.6929, -89.2182],
      zoom: 14,
      zoomControl: false,
      layers: [googleRoads]
    });

    // Reposicionar controles de zoom arriba a la derecha
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 2. Iconos personalizados
    const carIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3202/3202926.png',
      iconSize: [36, 36],
      iconAnchor: [18, 18],
      tooltipAnchor: [0, -18]
    });

    const baseIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/1670/1670080.png',
      iconSize: [34, 34],
      iconAnchor: [17, 17],
      tooltipAnchor: [0, -17]
    });

    // Marcador local
    let selfMarker = null;
    let initialLock = false;

    // 3. Geolocalización continua en segundo plano del navegador
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          if (!selfMarker) {
            selfMarker = L.marker([lat, lon], { icon: carIcon }).addTo(map);
            selfMarker.bindTooltip("Móvil (Tú)", { permanent: true, direction: 'top', className: 'unit-tag' });
          } else {
            selfMarker.setLatLng([lat, lon]);
          }

          // Centrado inicial automático
          if (!initialLock) {
            map.setView([lat, lon], 16);
            initialLock = true;
          }
        },
        (err) => console.warn('Error GPS:', err.message),
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    // 4. Modo Silencio de Cabina (Mute sin apagar rastreo)
    let isMuted = false;
    const btnMute = document.getElementById('btn-mute');
    const lblAudioStatus = document.getElementById('lbl-audio-status');

    btnMute.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        btnMute.classList.add('active-mute');
        btnMute.innerHTML = '<span>🔇</span> Silencio Activo';
        lblAudioStatus.textContent = 'Muteado';
        lblAudioStatus.className = '';
        lblAudioStatus.style.color = '#ef4444';
      } else {
        btnMute.classList.remove('active-mute');
        btnMute.innerHTML = '<span>🔊</span> Silencio Cabina';
        lblAudioStatus.textContent = 'Abierto';
        lblAudioStatus.className = 'status-active';
        lblAudioStatus.style.color = '#10b981';
      }
    });

    // 5. Alternar Vista Satélite / Calles
    let isSatellite = false;
    const btnLayer = document.getElementById('btn-layer');

    btnLayer.addEventListener('click', () => {
      if (isSatellite) {
        map.removeLayer(googleSatellite);
        map.addLayer(googleRoads);
        btnLayer.innerHTML = '<span>🛰️</span> Modo Satélite';
        isSatellite = false;
      } else {
        map.removeLayer(googleRoads);
        map.addLayer(googleSatellite);
        btnLayer.innerHTML = '<span>🗺️</span> Modo Calles';
        isSatellite = true;
      }
    });

    // 6. Eventos Táctiles y de Ratón para Botón PTT
    const btnPtt = document.getElementById('btn-ptt');
    const channelStatus = document.getElementById('channel-status');

    function startTalking(e) {
      if (e) e.preventDefault();
      btnPtt.classList.add('active');
      channelStatus.classList.add('transmitting');
      channelStatus.textContent = '▲ TRANSMITIENDO EN VIVO';
    }

    function stopTalking(e) {
      if (e) e.preventDefault();
      btnPtt.classList.remove('active');
      channelStatus.classList.remove('transmitting');
      channelStatus.textContent = '● CANAL LIBRE';
    }

    // Eventos táctiles móviles
    btnPtt.addEventListener('touchstart', startTalking, { passive: false });
    btnPtt.addEventListener('touchend', stopTalking, { passive: false });
    btnPtt.addEventListener('touchcancel', stopTalking, { passive: false });

    // Eventos mouse PC
    btnPtt.addEventListener('mousedown', startTalking);
    btnPtt.addEventListener('mouseup', stopTalking);
    btnPtt.addEventListener('mouseleave', stopTalking);
  </script>
</body>
</html>
