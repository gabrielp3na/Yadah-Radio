<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Flota - Móvil</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        input { 
            padding: 12px; 
            margin: 10px 0; 
            font-size: 16px; 
            width: 85%; 
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button.btn-login { 
            padding: 12px 20px; 
            font-size: 16px; 
            background: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
            width: 90%;
            margin-top: 10px;
        }
        button.btn-login:active { background: #0056b3; }
        
        /* Botón estilo Radio PTT (Grande y rojo) */
        #micButton { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 140px; 
            height: 140px; 
            font-size: 18px;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0px 6px 20px rgba(255, 77, 77, 0.4);
            margin-top: 20px;
            outline: none;
        }
        #micButton:active {
            background: #cc0000;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="card" id="login-section">
        <h2>Acceso a Flota</h2>
        <p style="color: #666; font-size: 14px;">Ingrese su contraseña para iniciar</p>
        
        <!-- Formulario con soporte para Enter -->
        <form onsubmit="event.preventDefault(); probarLogin();">
            <input type="password" id="passwordInput" placeholder="Ingrese clave">
            <br>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
    </div>

    <!-- Pantalla Principal de la Flota (Oculta hasta iniciar sesión) -->
    <div class="card" id="app-section" style="display:none;">
        <h2>Panel de Motorista</h2>
        <p style="color: green; font-size: 14px;">● GPS Activo en Segundo Plano</p>
        <p style="font-size: 13px; color: #555;">Mantén presionado o toca para hablar por radio:</p>
        
        <!-- Botón de Radio PTT -->
        <button id="micButton">RADIO PTT</button>
    </div>

    <!-- Lógica de la Aplicación -->
    <script>
        // ==========================================
        // 1. CONFIGURACIÓN Y ESTADO INICIAL
        // ==========================================
        const PASSWORD_CORRECTA = "1994";
        const MAX_INTENTOS = 3;
        let intentosFallidos = 0;
        let bloqueadoHasta = null;

        let localStream = null;
        let peerConnection = null;
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // ==========================================
        // 2. SISTEMA DE SEGURIDAD (3 INTENTOS / 15 MIN)
        // ==========================================
        function intentarLogin(passwordIngresada) {
            const ahora = new Date().getTime();

            if (bloqueadoHasta && ahora < bloqueadoHasta) {
                const minutosRestantes = Math.ceil((bloqueadoHasta - ahora) / 60000);
                alert(`Acceso bloqueado temporalmente. Intente de nuevo en ${minutosRestantes} minutos.`);
                return false;
            }

            if (passwordIngresada === PASSWORD_CORRECTA) {
                intentosFallidos = 0;
                bloqueadoHasta = null;
                console.log("Acceso concedido. Iniciando servicios...");
                iniciarAppPrincipal();
                return true;
            } else {
                intentosFallidos++;
                
                if (intentosFallidos >= MAX_INTENTOS) {
                    bloqueadoHasta = new Date().getTime() + (15 * 60 * 1000);
                    alert("Demasiados intentos fallidos. El acceso ha sido bloqueado por 15 minutos.");
                } else {
                    alert(`Contraseña incorrecta. Te quedan ${MAX_INTENTOS - intentosFallidos} intentos.`);
                }
                return false;
            }
        }

        // Función puente para la interfaz visual
        function probarLogin() {
            const pass = document.getElementById('passwordInput').value;
            const exito = intentarLogin(pass);
            
            if (exito) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('app-section').style.display = 'block';
            }
        }

        // ==========================================
        // 3. INICIO DE SERVICIOS PRINCIPALES (GPS + PTT)
        // ==========================================
        function iniciarAppPrincipal() {
            initAudio();
            iniciarGPSEnSegundoPlano();
            configurarBotonPTT();
        }

        // ==========================================
        // 4. MÓDULO DE AUDIO (WebRTC + VIBRACIÓN)
        // ==========================================
        async function initAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (error) {
                console.error("Error al acceder al micrófono:", error);
            }
        }

        function startTransmission() {
            if (navigator.vibrate) {
                navigator.vibrate(50); // Vibración táctil de confirmación de 50ms
            }

            if (!localStream) {
                console.error("Micrófono no disponible.");
                return;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            console.log("Transmitiendo audio en tiempo real...");
        }

        function stopTransmission() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            console.log("Transmisión detenida.");
        }

        function configurarBotonPTT() {
            const micButton = document.getElementById('micButton');
            if (!micButton) return;

            micButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startTransmission();
            });

            micButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                stopTransmission();
            });
        }

        // ==========================================
        // 5. MÓDULO DE RASTREO GPS PERSISTENTE
        // ==========================================
        function iniciarGPSEnSegundoPlano() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const datosUbicacion = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            velocidad: position.coords.speed,
                            timestamp: new Date().toISOString()
                        };
                        enviarUbicacionAlServidor(datosUbicacion);
                    },
                    (error) => {
                        console.error("Error en geolocalización:", error.message);
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    }
                );
            } else {
                console.error("La geolocalización no es compatible con este dispositivo.");
            }
        }

        function enviarUbicacionAlServidor(datos) {
            console.log("Ubicación enviada al servidor:", datos);
        }
    </script>
</body>
</html>
